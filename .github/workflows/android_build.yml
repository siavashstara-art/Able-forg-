name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: false

      - name: Accept Android SDK Licenses Non-Interactively
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Restore Debug Keystore from Base64
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Ensure Empty Local .env for Secrets Gradle Plugin (No Embedded Secrets)
        run: |
          touch .env

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Debug AAB (App Bundle)
        run: ./gradlew bundleDebug --stacktrace

      - name: Upload Debug AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/*.aab

      - name: Build Release AAB (If Release Signing Configured)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TARGET_KEYSTORE="${KEYSTORE_PATH:-my-upload-key.jks}"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ ! -f "$TARGET_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$TARGET_KEYSTORE"
          fi
          if [ -f "$TARGET_KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            ./gradlew bundleRelease --stacktrace
          else
            echo "RELEASE SIGNING NOT CONFIGURED"
          fi

      - name: Upload Release AAB Artifact
        if: hashFiles('app/build/outputs/bundle/release/*.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab
