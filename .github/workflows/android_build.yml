name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: false

      - name: Accept Android SDK Licenses Non-Interactively
        run: |
          mkdir -p "${ANDROID_HOME}/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "${ANDROID_HOME}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi
          set +e
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_HOME}" --licenses > /dev/null
          SDK_EXIT=${PIPESTATUS[1]}
          set -e
          if [ "$SDK_EXIT" -ne 0 ]; then
            exit "$SDK_EXIT"
          fi

      - name: Restore or Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s debug.keystore

      - name: Ensure Empty Local .env and .env.example for Secrets Gradle Plugin (No Embedded Secrets)
        run: |
          touch .env .env.example

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          if ! ./gradlew assembleDebug --no-configuration-cache -Dkotlin.compiler.execution.strategy=daemon -Djava.awt.headless=true --max-workers=2 2>&1 | tee build_debug_apk.log; then
            echo "=== GRADLE FAILURE SUMMARY (assembleDebug) ==="
            grep -E -A 25 "FAILURE:|What went wrong:|Execution failed for task" build_debug_apk.log || tail -n 50 build_debug_apk.log
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Debug AAB (App Bundle)
        run: |
          set -o pipefail
          if ! ./gradlew bundleDebug --no-configuration-cache -Dkotlin.compiler.execution.strategy=daemon -Djava.awt.headless=true --max-workers=2 2>&1 | tee build_debug_aab.log; then
            echo "=== GRADLE FAILURE SUMMARY (bundleDebug) ==="
            grep -E -A 25 "FAILURE:|What went wrong:|Execution failed for task" build_debug_aab.log || tail -n 50 build_debug_aab.log
            exit 1
          fi

      - name: Upload Debug AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/*.aab

      - name: Build Release AAB (If Release Signing Configured)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TARGET_KEYSTORE="${KEYSTORE_PATH:-my-upload-key.jks}"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ ! -f "$TARGET_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$TARGET_KEYSTORE"
          fi
          if [ -f "$TARGET_KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            ./gradlew bundleRelease --no-configuration-cache -Dkotlin.compiler.execution.strategy=daemon -Djava.awt.headless=true --max-workers=2
          else
            echo "RELEASE SIGNING NOT CONFIGURED"
          fi

      - name: Upload Release AAB Artifact
        if: hashFiles('app/build/outputs/bundle/release/*.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab
